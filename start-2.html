<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CLINIQ - Request Completed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #ffffff;
      font-size: 13px;
    }

    .top-navbar {
      background-color: #5d77a6;
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
    }
    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      width: 200px;
      flex-shrink: 0;
    }
    .navbar-brand img {
      height: 28px; width: 28px;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }
    .search-display {
      width: 100%;
      height: 32px;
      border-radius: 20px;
      background: #ffffff;
    }

    .sidebar {
      position: fixed;
      top: 52px; left: 0;
      width: 200px;
      height: calc(100vh - 52px);
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      z-index: 99;
      border-right: 1px solid #6882b0;
    }
    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 12px 12px;
      background: #5d77a6;
      border-radius: 10px;
      padding: 9px 11px;
    }
    .user-avatar {
      background: #ffffff;
      color: #5d77a6;
      font-weight: 700;
      font-size: 0.78rem;
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .user-name { color: #ffffff; font-weight: 600; font-size: 0.78rem; line-height: 1.3; }
    .user-role { color: rgba(255,255,255,0.75); font-size: 0.67rem; }

    .nav-section-pill {
      display: inline-block;
      background: #5873a1;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 20px;
      padding: 3px 14px;
      margin: 8px 12px 4px;
    }
    .nav-link-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      color: #5873a1;
      font-size: 0.78rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.12s;
    }
    .nav-link-item:hover { background: #f4f6fb; color: #5873a1; }

    .sign-out-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 12px 6px;
      background: #5873a1;
      border-radius: 20px;
      padding: 7px 14px;
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      width: fit-content;
    }
    .sign-out-btn:hover { background: #4a629a; color: #ffffff; }

    .sidebar-logo-bottom {
      margin-top: auto;
      display: flex;
      justify-content: center;
      padding: 16px 0 18px;
    }
    .sidebar-logo-bottom img { height: 60px; width: 60px; object-fit: contain; }

    .main-wrapper {
      margin-left: 200px;
      margin-top: 52px;
      padding: 40px 60px;
      min-height: calc(100vh - 52px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    
    .success-card {
      background: #bde8d3;
      border: 2px solid #6cc22c;
      border-radius: 14px;
      padding: 56px 40px 36px;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .success-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #000000;
      margin-bottom: 8px;
    }
    .success-subtitle {
      font-size: 0.82rem;
      color: #545454;
      margin-bottom: 28px;
    }
    .success-subtitle strong { font-weight: 700; }

    .btn-done {
      background: #75bb98;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 10px 44px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-done:hover { background: #75bb98; }
  </style>
</head>
<body>

<div class="top-navbar">
  <div class="navbar-brand">
    <img src="logo.png" alt="logo"/>
    CLINIQ
  </div>
  <div class="flex-grow-1 px-2">
    <div class="search-display"></div>
  </div>
</div>

<div class="sidebar">
  <div class="user-card">
    <div class="user-avatar">MC</div>
    <div>
      <div class="user-name">Curitana, MC</div>
      <div class="user-role">Lab Administrator</div>
    </div>
  </div>

  <span class="nav-section-pill">Overview</span>
  <a href="#" class="nav-link-item">
    <img src="business.png" alt="" style="width:16px;height:16px;"> Dashboard
  </a>

  <span class="nav-section-pill">Management</span>
  <a href="#" class="nav-link-item">
    <img src="search.png" alt="" style="width:16px;height:16px;"> Test Catalog
  </a>
  <a href="#" class="nav-link-item">
    <img src="flask.png" alt="" style="width:16px;height:16px;"> Lab Request
  </a>
  <a href="#" class="nav-link-item">
    <img src="invoice.png" alt="" style="width:16px;height:16px;"> Billing
  </a>

  <span class="nav-section-pill">Reports</span>
  <a href="#" class="nav-link-item">
    <img src="analysis.png" alt="" style="width:16px;height:16px;"> Analytics
  </a>

  <a href="#" class="sign-out-btn">
    <img src="logout.png" alt="" style="width:16px;height:16px;filter:brightness(0) invert(1);"> Sign Out
  </a>

  <div class="sidebar-logo-bottom">
    <img src="logo.png" alt="logo"/>
  </div>
</div>

<div class="main-wrapper">
  <div class="success-card">
    <img src="check-removebg-preview.png" alt="check" style="width:80px; height:80px; margin-bottom:24px;"/>
    <div class="success-title">Request Completed!</div>
    <div class="success-subtitle">
      #REQ-2026-001 has been marked as <strong>Completed</strong>. Results are now available for download
    </div>

    <button class="btn-done">Done</button>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
